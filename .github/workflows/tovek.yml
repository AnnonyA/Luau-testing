name: Tovek checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-15
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/build_site.mjs && node --test web-server/ui/studio.test.mjs scripts/test_site.mjs scripts/test_decompiler.mjs scripts/test_browser_engine.mjs scripts/test_browser_worker.mjs
      - run: npm install --prefix "$RUNNER_TEMP/tovek-browser" --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Test the browser decompiler
        run: node scripts/test_browser_e2e.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/tovek-browser/node_modules/playwright-core
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
